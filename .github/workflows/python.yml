name: Python wheels

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  matrix:
    name: Select supported Python versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      uv-version: ${{ steps.uv.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Refresh the interpreter catalogue, then use this same uv version in every job.
          version: latest
          enable-cache: false
      - name: Test matrix selection
        run: >-
          uv run --no-project --python 3.13 --with packaging --with pytest
          pytest tests/ci
      - name: Select matrix from requires-python
        id: matrix
        run: uv run --no-project --python 3.13 --with packaging .github/scripts/python_matrix.py

  build:
    name: Python ${{ matrix.label }} on ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      # Version-only requests can select emulated x64 Python on Windows ARM64.
      UV_PYTHON_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and the matrix interpreter
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ needs.matrix.outputs.uv-version }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install test dependencies
        run: uv sync --locked --only-group test
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          args: --out dist --interpreter ${{ matrix.interpreter }} --generate-stubs
          manylinux: "2014"
      - name: Check wheel contents
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import ast
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          with ZipFile(wheels[0]) as wheel:
              assert "phimaker/py.typed" in wheel.namelist(), "Typing marker is missing"
              stub = wheel.read("phimaker/phimaker.pyi").decode()
              for declaration in (
                  "def sixpack(", "def sixpack_from_inclusion(",
                  "class DiagramEnsemble:", "class CylinderMetadata:",
              ):
                  assert declaration in stub, f"Generated stubs omit {declaration}"
              functions = {
                  node.name: node for node in ast.parse(stub).body
                  if isinstance(node, ast.FunctionDef)
              }
              assert "get_persistence_map" not in functions, "Retired API is still exported"
              for name in ("sixpack", "sixpack_from_inclusion"):
                  function = functions[name]
                  arguments = {arg.arg: arg.annotation for arg in function.args.args}
                  assert ast.unparse(arguments["get_representatives"]) == "bool"
                  defaults = dict(zip(
                      [arg.arg for arg in function.args.args][-len(function.args.defaults):],
                      function.args.defaults,
                  ))
                  assert ast.literal_eval(defaults["get_representatives"]) is False
              ensemble = next(
                  node for node in ast.parse(stub).body
                  if isinstance(node, ast.ClassDef) and node.name == "DiagramEnsemble"
              )
              getters = {
                  node.name: node for node in ensemble.body
                  if isinstance(node, ast.FunctionDef)
              }
              for name in (
                  "domain_representatives", "codomain_representatives", "image_representatives",
                  "kernel_representatives", "cokernel_representatives",
                  "kernel_to_domain", "domain_to_image", "image_to_codomain",
                  "domain_to_codomain", "codomain_to_cokernel"
              ):
                  assert ast.unparse(getters[name].returns) == "dict[int, list[int]] | None"
              assert ast.unparse(getters["relative_representatives"].returns) == (
                  "dict[int, tuple[list[int], list[int]]] | None"
              )
          PY
      - name: Install the built wheel
        run: >-
          uv pip install --python .venv --no-index --find-links dist
          --only-binary :all: --no-deps phimaker
      - name: Test the installed wheel
        run: uv run --no-sync pytest tests/python
      - name: Upload tested release wheel
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish tested wheels to PyPI
    if: github.event_name == 'release'
    needs: [matrix, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ needs.matrix.outputs.uv-version }}
          enable-cache: false
      - name: Download tested wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/*.whl
