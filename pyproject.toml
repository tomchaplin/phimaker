[project]
name = "phimaker"
version = "0.3.0"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Thomas Chaplin" }, { name = "Abhinav Natarajan" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/tomrchaplin/phimaker"

[dependency-groups]
test = [
  "gudhi>=3.13.0",
  "matplotlib>=3.10.9",
  "numpy>=2.2.6",
  "polars>=1.44.2",
]

[build-system]
requires = ["maturin~=1.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"

[tool.pyrefly]
preset = "default"

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # General
  "CPY",  # flake8-copyright/missing-copyright-notice: requires cpyright notices within each Python file
  "ERA",  # eradicate: disallows commented code
  "W191",  # pycodestyle/tab-indentation: disallows tab indentation
  "D206",  # pydocstyle/docstring-tab-indentation: disallows tab indentation in docstring
  "E111",  # pycodestyle/indentation-with-invalid-multiple: forces indentation to be a multiple of 4 spaces
  "E114",  # pycodestyle/indentation-with-invalid-multiple-comment: same as above for comments
  "E117",  # pycodestyle/over-indented: disallows more than 4 spaces of indentation
  "D203",  # pydocstyle/incorrect-blank-line-before-class: requires blank line before class docstring
  "PLR0913",  # pylint/too-many-arguments: too many arguments in function signature
  "PYI021",  # flake8-pyi/docstring-in-stub: disallows docstrings in stub files (not good for extension modules)
  "TD003",  # flake8-todos/missing-todo-link: disallows todos without an issue link
  "ANN401",  # flake8-annotations/any-type: disallows type 'Any' in function signatures
  "ANN003",  # flake8-annotations/missing-type-kwargs: disallows missing types for keyword args dictionary
  "FIX002",  # flake8-fixme/line-contains-todo: checks for TODO comments
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "S101",  # flake8-bandit: disallows use of assert statements
  "PLR2004",  # pylint: disallows magic values
  "INP001",  # pylint: test folder does not need __init__.py
  "D",  # pydocstyle: tests do not need docs
]
"**/__init__.py" = [
  "F401",  # pyflakes: disallows unused imports
  "F403",  # pyflakes: disallows wildcard imports
]
"**.pyi" = ["ALL"]
"docs/**.py" = [
  "INP001",  # pylint: docs folder does not need __init__.py
  "D",  # pydocstyle: doc setup files do not need docs
]
