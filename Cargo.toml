[package]
name = "phimaker"
version = "0.4.0"
edition = "2024"
description = "Compute kernel, cokernel, and image persistence from maps of F2 chain complexes."
readme = "README.md"
homepage = "https://github.com/tomchaplin/phimaker"
repository = "https://github.com/tomchaplin/phimaker"
license = "GPL-3.0-or-later"
keywords = ["chain-complex", "persistence-module", "persistent-homology", "topology"]
categories = ["mathematics", "science"]
exclude = ["docs/**/*", "scripts/**/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]
name = "phimaker"

[dependencies]
atomic_refcell = "0.1.14"
bincode = "1.3.3"
crossbeam = "0.8.5"
disjoint-sets = "0.4.2"
itertools = "0.14.0"  # check
log = "0.4.34"
lophat = { version = "0.14.0", default-features = false, features = ["local_thread_pool", "serde"] }
macro_rules_attribute = { version = "0.2.3", optional = true }
pyo3 = { version = "0.29.2", features = ["experimental-inspect"], optional = true }
pyo3-log = { version = "0.13.4", optional = true }
rayon = "1.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"

[features]
default = ["python-module"]
python-module = ["dep:macro_rules_attribute", "dep:pyo3", "dep:pyo3-log", "lophat/python-module"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
tabs_in_doc_comments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }
